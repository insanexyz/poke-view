<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pokeball-loading.css">
  <script defer src="script.js"></script>
</head>
<body>

  <nav>
    <h1>PokeView</h1>
  </nav>

  <div class="pokeball"></div>

  <div class="search-wrapper">
    <input type="search" id="search">
  </div>

  <div class="container">
    <div class="content-box">

      <!-- left side - display pokemon info -->
       <div class="pokemon-info card">
        <img src="" alt="" class="pokemon-img">
        <div class="pokemon-types">
          <span class="type-box grass">GRASS</span>
          <span class="type-box poison">POISON</span>
        </div>
        <div class="pokemon-description">
        </div>
       </div>

       <!-- right side - display pokemon lists -->
        <div class="pokemon-list-container card">
        </div>

    </div>
  </div>
</body>
</html>
